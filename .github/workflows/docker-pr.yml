name: Docker Image PR Build

on:
  pull_request:
    paths:
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - .trivyignore
      - .github/docker-smoke.sh
      - .github/actions/scan-image/**
      - .github/workflows/docker-pr.yml

jobs:
  build-and-smoke:
    name: build-and-smoke (${{ matrix.platform }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned rclone version from the Dockerfile
        id: rclone
        run: |
          version=$(sed -n 's/^ARG SALMON_RCLONE_VERSION=//p' Dockerfile)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "SALMON_RCLONE_VERSION in the Dockerfile is not X.Y.Z: '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image for ${{ matrix.platform }} (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: salmon-docker-pr:smoke
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Run smoke test in the built image
        env:
          PLATFORM: ${{ matrix.platform }}
          PINNED_VERSION: ${{ steps.rclone.outputs.version }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          docker run --rm --platform "$PLATFORM" \
            -v "$WORKSPACE/.github/docker-smoke.sh:/smoke.sh:ro" \
            --entrypoint sh \
            salmon-docker-pr:smoke \
            /smoke.sh "$PINNED_VERSION"

      # Same scan and threshold as the workflows that publish the image, so a PR that would
      # block a release fails here first.
      - name: Scan the built image
        uses: ./.github/actions/scan-image
        with:
          image-ref: salmon-docker-pr:smoke
