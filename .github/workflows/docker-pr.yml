name: Docker Image PR Build

on:
  pull_request:
    paths:
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - .github/docker-smoke.sh
      - .github/workflows/docker-pr.yml

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build multi-arch image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and load amd64 image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: salmon-docker-pr:smoke
          cache-from: type=gha

      - name: Run smoke test in the built image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/.github/docker-smoke.sh:/smoke.sh:ro" \
            --entrypoint sh \
            salmon-docker-pr:smoke \
            /smoke.sh
