# TEMPORARY, reverted before merge: build-alpha.yml's build, scan and push path, run on this PR with
# a second job-local registry (localhost:5001) standing in for ghcr.io. Differences from
# build-alpha.yml: trigger, no ghcr login, destination registry, --dest-tls-verify=false, and the
# digest check at the end.
name: TMP publish dry run

on:
  pull_request:

jobs:
  publish-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      registry:
        image: registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports:
          - 5000:5000
      fakeghcr:
        image: registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports:
          - 5001:5000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            localhost:5001/smoked-salmon
          flavor: |
            latest=false
          tags: |
            type=raw,value=alpha
            type=sha,prefix=alpha-

      - name: Build the alpha image into the job's registry
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: localhost:5000/smoked-salmon:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the linux/amd64 image
        uses: ./.github/actions/scan-image
        with:
          image-ref: localhost:5000/smoked-salmon@${{ steps.build.outputs.digest }}
          platform: linux/amd64

      - name: Scan the linux/arm64 image
        uses: ./.github/actions/scan-image
        with:
          image-ref: localhost:5000/smoked-salmon@${{ steps.build.outputs.digest }}
          platform: linux/arm64

      - name: Push the scanned alpha image
        env:
          SOURCE: localhost:5000/smoked-salmon@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          skopeo --version
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            skopeo copy --all --preserve-digests --src-tls-verify=false --dest-tls-verify=false "docker://$SOURCE" "docker://$tag"
            echo "pushed $tag (${SOURCE#*@})"
          done <<< "$TAGS"

      - name: Check every pushed tag is the scanned index, and each platform image matches
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            pushed="sha256:$(skopeo inspect --raw --tls-verify=false "docker://$tag" | sha256sum | cut -d' ' -f1)"
            echo "$tag -> $pushed (scanned $DIGEST)"
            [ "$pushed" = "$DIGEST" ]
          done <<< "$TAGS"
          echo "== scanned index =="
          skopeo inspect --raw --tls-verify=false "docker://localhost:5000/smoked-salmon@$DIGEST" | jq -c '.manifests[] | {digest, platform}'
          echo "== pushed index (first tag) =="
          skopeo inspect --raw --tls-verify=false "docker://$(head -n1 <<< "$TAGS")" | jq -c '.manifests[] | {digest, platform}'
          docker run --rm --platform linux/arm64 --entrypoint sh "$(head -n1 <<< "$TAGS")" -c 'uname -m; rclone version | head -1'
