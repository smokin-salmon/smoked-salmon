name: Create and publish Docker images

on:
  release:
    types:
      - published
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # The job's own token only reads the repository; the version bump is pushed with the release App's token.
    permissions:
      contents: read
      packages: write

    # A registry that lives only as long as this job. The image is built into it, scanned there, and
    # the scanned digest is then copied to ghcr.io, so what publishes is the bytes the scan passed.
    services:
      registry:
        image: registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports:
          - 5000:5000

    # Order matters for a release: the image is built from master plus the version bump and scanned
    # before anything leaves this job. The bump commit on master is what tells users a new version
    # exists (release_notification.py), so it is pushed only once there is a scanned image to ship.
    steps:
      # The tag is written into version.toml, which every installed salmon reads from master: refuse
      # anything but X.Y.Z (no v, no suffix) before anything else runs.
      - name: Refuse a release tag that is not X.Y.Z
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! $TAG =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The release tag must be X.Y.Z (three dot-separated integers, no 'v', no suffix), got '$TAG'." >&2
            echo "Nothing was changed. Delete the release and its tag, then publish it again with a tag like 0.25.0." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # All history and tags, for the version bump commit and the tag move
          persist-credentials: false

      - name: Get release version or branch name
        id: get_version_or_branch
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            RELEASE_VERSION="${{ github.event.release.tag_name }}"
            if [ -z "$RELEASE_VERSION" ]; then
              echo "Error: RELEASE_VERSION is empty. Ensure a valid release tag."
              exit 1
            fi
            echo "VERSION=${RELEASE_VERSION}" >> $GITHUB_ENV
            echo "UPDATE_VERSION=true" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BRANCH_NAME="${{ github.ref_name }}"
            echo "VERSION=${BRANCH_NAME}" >> $GITHUB_ENV
            echo "UPDATE_VERSION=false" >> $GITHUB_ENV
          else
            echo "Unsupported event: ${{ github.event_name }}"
            exit 1
          fi

      - name: Get release notes (only for release events)
        if: github.event_name == 'release'
        id: get_release_info
        run: |
          # Correct way to store multi-line release notes in GITHUB_ENV
          {
            echo "RELEASE_NOTES<<EOF"
            echo "$RELEASE_NOTES"
            echo "EOF"
          } >> $GITHUB_ENV
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}

      # The bump commit goes on top of master, and the tag is moved onto it, so the image is built
      # from that same tree: master with the bumped files.
      - name: Check out master for the version bump (only on release)
        if: github.event_name == 'release' && env.UPDATE_VERSION == 'true'
        run: git checkout master

      # CI installs the uv the image is built with: one pin, in the Dockerfile, which Dependabot bumps.
      - name: Read the pinned uv version from the Dockerfile
        id: uv
        run: |
          version=$(sed -n 's/^FROM ghcr\.io\/astral-sh\/uv:\([^@]*\)@.*/\1/p' Dockerfile)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The uv image tag in the Dockerfile is not X.Y.Z: '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ steps.uv.outputs.version }}

      # Skipped when version.toml is already at this version: a re-run after the bump was pushed
      # (say the image push failed) must not add the changelog entry twice.
      - name: Update version files
        if: github.event_name == 'release' && env.UPDATE_VERSION == 'true'
        run: |
          PYPROJECT_FILE="pyproject.toml"

          # Prepend new changelog entry and update current version
          uv run --with tomlkit python - <<'PY'
          import os
          from datetime import date

          import tomlkit

          version = os.environ["VERSION"]
          path = "src/salmon/data/version.toml"

          with open(path, "r", encoding="utf-8") as f:
              data = tomlkit.load(f)

          if data["current"] == version:
              print(f"{path} is already at {version}; not bumping it again")
              raise SystemExit(0)

          data["current"] = version

          entry = tomlkit.table()
          entry.add("version", version)
          entry.add("date", date.today().strftime("%Y-%m-%d"))
          entry.add("notes", tomlkit.string("\n" + os.environ["RELEASE_NOTES"] + "\n", multiline=True))
          entry.add(tomlkit.nl())

          data["changelog"].insert(0, entry)

          with open(path, "w", encoding="utf-8") as f:
              tomlkit.dump(data, f)
          PY

          # Update version in pyproject.toml
          sed -i "s/^version = \".*\"/version = \"${{ env.VERSION }}\"/" "$PYPROJECT_FILE"

          # Regenerate uv.lock to update the package version
          uv lock
        env:
          RELEASE_NOTES: ${{ env.RELEASE_NOTES }}

      # Clients decode version.toml with VersionData; a file they cannot read, or one that does not name
      # this release, stops the run here, before anything is pushed. Also passes on a re-run that skipped the bump.
      - name: Check the bumped version.toml
        if: github.event_name == 'release' && env.UPDATE_VERSION == 'true'
        run: uv run --no-dev python .github/scripts/check-release-version.py

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Get lowercase repo name
        id: get_lowercase_repo_name
        run: |
          REPO_NAME=${{ env.IMAGE_NAME }}
          echo "LOWER_CASE_REPO_NAME=${REPO_NAME,,}" >> $GITHUB_ENV

      - name: Debug VERSION and UPDATE_VERSION
        run: |
          echo "VERSION=${{ env.VERSION }}"
          echo "UPDATE_VERSION=${{ env.UPDATE_VERSION }}"

      # A fixable CRITICAL stops the run here, before master, the tag or ghcr.io change.
      - name: Build and scan the image
        id: build
        uses: ./.github/actions/build-scan
        with:
          labels: ${{ steps.meta.outputs.labels }}

      # The release App may push to master. Its token is minted only here, after the build and the scan,
      # and scoped to this repository's contents, plus workflows: GitHub refuses an App's push that brings
      # in changes to .github/workflows/ without that permission.
      - name: Get the release App's token (only on release)
        id: app-token
        if: github.event_name == 'release' && env.UPDATE_VERSION == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      # One atomic push: master and the moved tag both land, or neither does.
      - name: Commit the version update, move the tag and push both (only on release)
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        if: github.event_name == 'release' && env.UPDATE_VERSION == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/salmon/data/version.toml pyproject.toml uv.lock
          if git diff --cached --quiet; then
            echo "master already has the $VERSION bump"
          else
            git commit -m "Update version.toml/pyproject.toml to $VERSION with changelog"
          fi
          git tag -f "$VERSION"
          git push --atomic "https://x-access-token:${APP_TOKEN}@github.com/${REPO}.git" master "+refs/tags/$VERSION"

      - name: Push the scanned image
        uses: ./.github/actions/push-scanned
        with:
          source: ${{ steps.build.outputs.image-ref }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.LOWER_CASE_REPO_NAME }}:${{ env.VERSION }}
            ${{ steps.meta.outputs.tags }}
          registry-token: ${{ github.token }}

      # uv installs follow `stable` (README). It moves to the release once the release has shipped, in a push of its
      # own so that a refusal never holds the release back. The App's token carries workflows: write, so a push that
      # carries workflow changes should not be refused; if it is, the warning says how to move it by hand
      # (docs/ci-and-releases.md).
      - name: Move the stable branch to the release (only on release)
        if: github.event_name == 'release' && env.UPDATE_VERSION == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! git push "https://x-access-token:${APP_TOKEN}@github.com/${REPO}.git" "refs/tags/$VERSION^{commit}:refs/heads/stable"; then
            echo "::warning::stable was not moved to $VERSION. Move it by hand: git fetch --force origin tag $VERSION && git push origin '$VERSION^{commit}:refs/heads/stable'"
          fi
