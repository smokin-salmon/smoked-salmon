name: Build Alpha Image

on:
  push:
    branches:
      - master

jobs:
  build-alpha-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # A registry that lives only as long as this job. The image is built into it, scanned there, and
    # the scanned digest is then copied to ghcr.io, so what publishes is the bytes the scan passed.
    services:
      registry:
        image: registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports:
          - 5000:5000

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # CI installs the uv the image is built with: one pin, in the Dockerfile, which Dependabot bumps.
      - name: Read the pinned uv version from the Dockerfile
        id: uv
        run: |
          version=$(sed -n 's/^FROM ghcr\.io\/astral-sh\/uv:\([^@]*\)@.*/\1/p' Dockerfile)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The uv image tag in the Dockerfile is not X.Y.Z: '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          version: ${{ steps.uv.outputs.version }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=alpha
            type=sha,prefix=alpha-

      # A fixable CRITICAL stops the run here, before anything is pushed.
      - name: Build and scan the alpha image
        id: build
        uses: ./.github/actions/build-scan
        with:
          labels: ${{ steps.meta.outputs.labels }}

      - name: Push the scanned alpha image
        uses: ./.github/actions/push-scanned
        with:
          source: ${{ steps.build.outputs.image-ref }}
          tags: ${{ steps.meta.outputs.tags }}
          registry-token: ${{ github.token }}
