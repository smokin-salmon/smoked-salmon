name: Build Alpha Image

on:
  push:
    branches:
      - master

jobs:
  build-alpha-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # A registry that lives only as long as this job. The image is built into it, scanned there, and
    # the scanned digest is then copied to ghcr.io, so what publishes is the bytes the scan passed.
    services:
      registry:
        image: registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports:
          - 5000:5000

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # network=host lets the builder container reach the job's registry on localhost:5000.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=alpha
            type=sha,prefix=alpha-

      - name: Build the alpha image into the job's registry
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: localhost:5000/smoked-salmon:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the linux/amd64 image
        uses: ./.github/actions/scan-image
        with:
          image-ref: localhost:5000/smoked-salmon@${{ steps.build.outputs.digest }}
          platform: linux/amd64

      - name: Scan the linux/arm64 image
        uses: ./.github/actions/scan-image
        with:
          image-ref: localhost:5000/smoked-salmon@${{ steps.build.outputs.digest }}
          platform: linux/arm64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # skopeo reads the login above from ~/.docker/config.json. --preserve-digests makes the copy
      # fail rather than push anything but the scanned manifests and layers.
      - name: Push the scanned alpha image
        env:
          SOURCE: localhost:5000/smoked-salmon@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            skopeo copy --all --preserve-digests --src-tls-verify=false "docker://$SOURCE" "docker://$tag"
            echo "pushed $tag (${SOURCE#*@})"
          done <<< "$TAGS"
