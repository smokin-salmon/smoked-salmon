name: Lint

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Through uv, so CI runs the ruff version locked in uv.lock, the same one as
      # `uv run ruff` locally; ruff-action would take the newest release instead.
      - name: Run Ruff
        run: uv run --frozen --only-group dev ruff check --output-format=github .

      - name: Check formatting
        run: uv run --frozen --only-group dev ruff format --check --diff .

  pyright:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync && uv pip install basedpyright

      - name: Run Pyright Type Check
        run: uv run basedpyright
