name: Lint

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # Through uv, so CI runs the ruff version locked in uv.lock, the same one as
      # `uv run ruff` locally; ruff-action would take the newest release instead.
      - name: Run Ruff
        run: uv run --frozen --only-group dev ruff check --output-format=github .

      - name: Check formatting
        run: uv run --frozen --only-group dev ruff format --check --diff .

  pyright:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # basedpyright is in the dev group, so CI runs the version locked in uv.lock.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run Pyright Type Check
        run: uv run --frozen basedpyright
