name: Build and scan the image
description: >-
  Build the image for linux/amd64 and linux/arm64 into the job's registry (localhost:5000), then scan
  each arch with scan-image. A fixable CRITICAL fails the job here, before anything is pushed. The
  calling job runs the registry as a service (`registry:3` on port 5000) and checks out the tree to
  build; .github/actions/push-scanned then copies the scanned digest to ghcr.io.

inputs:
  labels:
    description: The image's labels, from docker/metadata-action.
    required: true

outputs:
  image-ref:
    description: The scanned image in the job's registry (localhost:5000/smoked-salmon@sha256:...).
    value: localhost:5000/smoked-salmon@${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    # network=host lets the builder container reach the job's registry on localhost:5000.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: network=host

    - name: Build the image into the job's registry
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: localhost:5000/smoked-salmon:scan
        labels: ${{ inputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Scan the linux/amd64 image
      uses: ./.github/actions/scan-image
      with:
        image-ref: localhost:5000/smoked-salmon@${{ steps.build.outputs.digest }}
        platform: linux/amd64

    - name: Scan the linux/arm64 image
      uses: ./.github/actions/scan-image
      with:
        image-ref: localhost:5000/smoked-salmon@${{ steps.build.outputs.digest }}
        platform: linux/arm64
