# OPS's Do-Not-Upload list: OPS wiki article 767, revision 17 of 2026-08-18 (the list dates from 2026-07-03).
# Checked against that article on 2026-10-06. The maintainers update this file with salmon's releases.
#
# salmon refuses to upload a release that matches an entry to OPS (other trackers are not affected).
# Each [[entry]] names:
#   artist        that artist's whole discography;
#   artist, album that one release;
#   album         that release whatever the artist (Various Artists compilations);
#   label         every release on that label;
#   media         (optional) only the releases from that media, such as "WEB";
#   note          why, in a few words.
# Case, accents and punctuation do not count, and "&" is "and". The artist must be one of the release's main
# artists exactly ("Viper" is not "Viper UK"). Every word of the album must be in the release's title or edition
# title, and every word of the label in its label.
# One wiki line naming several albums is one entry per album. Names are spelled as the article spells them.

