[[changelog]]
version = "0.14.0"
date = "2026-09-29"
notes = """

## ⚠️ Behaviour changes

- **`--skip-flac-upload` no longer touches the folder you give it.** salmon copies it into `download_directory/.salmon-staging/` and works on the copy, which is removed when the run ends. The run needs free space for one copy of the album in `download_directory`. The FLAC the transcodes point to must now match the release's edition (year, catalogue number, edition title); with several matches salmon asks, and `--yes-all` stops. Thanks @chodeus
- **The MQA check reads every FLAC file**, not only the first one. On an SSD it adds under half a second, even on a 30-track 24-bit album. `mqa_check_all_tracks = false` under `[upload]` goes back to checking the first file only, faster but MQA on another track is then missed. Thanks @chodeus
- **Embedded pictures over RED's 1 MiB limit are removed before upload.** When a FLAC's embedded pictures plus padding exceed 1 MiB, salmon removes its pictures, keeps 8 KiB of padding and saves the front cover as `cover.jpg`/`cover.png` if the folder has no cover file (that file is then used as the cover). The audio is not changed, scene releases are never touched, and files under the limit are left as they are. `strip_oversized_pictures = false` under `[image]` only lists the files. Thanks @chodeus
- **The upload stops on a file that does not decode**, even when you decline to sanitize and with `yes_all`. A FLAC whose only problem is a missing MD5 still uploads after you decline, as before. Thanks @chodeus
- **MP3s with stream damage now fail the integrity check** (truncated file, stream errors, garbage before or after the audio, bad CRCs, a wrong VBR header) and get the sanitize offer (`mp3val -f`). You can decline and go on. A file that is not MPEG audio at all stops the upload. Notes about tags or a missing VBR header are shown but pass. Thanks @chodeus
- **A tracker that asks salmon to wait more than a minute is no longer waited for**: the request stops with "try again later" instead. See Tracker & Security below.

## ✨ New Features & Improvements

- When the folder has no cover and the source has no cover URL (or the download fails), salmon now uses the front cover embedded in the FLACs. It is removed after upload like a downloaded cover when `remove_auto_downloaded_cover_image` is on, and for scene uploads.
- An album with no MD5 stored in its FLACs is reported once ("12 of 12 file(s) have no MD5 signature stored"), with what it means, instead of two lines per file full of flac's progress characters. The sanitize question says why it is asked. Thanks @chodeus
- After sanitizing, the files are checked again, in the upload and in `salmon check integrity`, so a sanitize that did not work is caught. Thanks @chodeus
- With `--skip-flac-upload`, a downconversion format the edition already has is marked `DUPE RISK`, left out of the default choice and of `--yes-all`, and can still be picked by number. Thanks @chodeus

## 🐛 Bug Fixes

- **Genre tags reach the tracker valid.** `Drum & Bass` went out as `drum.&.bass` and `Dance / Pop` as `dance./.pop`; they now go out as `drum.and.bass`, and `dance` plus `pop`. Qobuz's `Electronic → House` and Discogs's `Folk, World, & Country` are split too, genres typed in the review editor or the JSON editor go through the same cleanup, and the AI review can no longer empty the genres or other fields with blank values. Tag order no longer changes from run to run. Thanks @chodeus
- **Retagging writes to the right files** on releases with 10 or more disc folders (`CD10` was taken before `CD2`) and on a flat folder whose file names carry the disc (`01-CD1.flac`, `01-CD2.flac`). When salmon cannot tell which file is which track, it skips retagging and says why, instead of writing titles to the wrong files. Thanks @chodeus
- A failed rclone copy to a seedbox no longer adds the torrent to that seedbox's client anyway. Other seedboxes and other folders of the same run are not affected.
- When adding spectrals to the torrent description fails, salmon now prints the spectrals BBCode so it can be pasted by hand, and still files the lossy master report.
- The recent uploads dupe check no longer flags releases that only share an artist with yours. Thanks @tomerh2001
- The dupe checks after the metadata review (the last-minute check, the request search and the group search on a second tracker) now use the title, artists and catalogue number as edited, not as they were before the review.
- Sanitizing a FLAC that flac cannot re-encode no longer loses it: the file used to be left renamed to `.corrupted`, and the check afterwards passed without it.
- `auto_compress_cover` no longer crashes on a transparent, palette or 16-bit PNG cover it has to shrink. Transparency becomes white, and a cover that cannot be read is left out with a message.
- Tidal: a `Retry-After` of `nan`, `inf`, a negative value or a past date now backs off normally instead of crashing or hanging, and a token Tidal rejects is fetched again once. Thanks @chodeus

## 🔒 Tracker & Security Improvements

- **Secrets stay out of salmon's output.** Seedbox passwords and connection strings in rclone commands and rclone's own errors, torrent client passwords, and the tracker's session cookie, API key, authkey and passkey are now shown as `[REDACTED]` in normal and debug output (`debug_tracker_connection`, `salmon checkconf`). Output you paste in a support thread no longer carries them. Thanks @chodeus
- **A tracker's `Retry-After` is read safely.** A date, `nan` or an unreadable value no longer crashes the request, and `inf` or a huge value no longer hangs it. salmon waits at least 2 seconds, so `0` cannot trigger a burst of retries, and at most 60 seconds in total per request; a tracker asking for more gets "try again later" and no further request. An upload answered with an error that mentions the rate limit, other than a 429, is looked up by its infohash instead of sent again. Thanks @chodeus

## What's Changed
* Skip a seedbox's seed task when its rclone copy fails by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/512
* Add a CodeRabbit config based on AGENTS.md by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/513
* Keep secrets out of salmon's output by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/515
* Work on a scratch copy and match the edition with --skip-flac-upload by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/514
* Tidal: handle a non-finite Retry-After and replace a rejected token by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/516
* Keep the spectrals bbcode and lossy master report on a failed description edit by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/517
* Fix recent upload false positives on a shared artist prefix by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/518
* Use the reviewed metadata for dupe checks after the review by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/524
* Pair retag disc/track pairs one folder per disc, or refuse by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/520
* Fix malformed genre tags with & or / and guard the AI review's genres by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/523
* Integrity checks: MQA on every file, re-check after sanitizing, mp3val damage by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/525
* Strip embedded pictures over RED's 1 MiB limit before upload by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/522
* Fix compress_pictures crash on RGBA, P, LA and I;16 covers by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/528
* Fall back to an embedded FLAC front cover when the folder has none by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/530
* Bound the wait for a tracker's Retry-After, and stop on a long one by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/527

**Full Changelog**: https://github.com/smokin-salmon/smoked-salmon/compare/0.13.0...0.14.0

"""

[[changelog]]
version = "0.13.0"
date = "2026-09-28"
notes = """

## ⚠️ Behaviour changes

- A `[[seedbox]]` entry with `enabled = false` is now skipped. Before, the flag was ignored and a disabled entry still logged in to its client, ran rclone and added the torrent. Entries without `enabled` keep uploading as before.
- The upload now stops when the log check cannot verify the audio (a file that cannot be read or decoded, a folder that cannot be scanned). Before, it printed the error and carried on unverified. Logs that cannot be checked at all (unparseable, no TOC, range rips salmon cannot rebuild) are shown as "Log not checked" and do not stop the upload. `--skip-log-check` skips the check as before.

## ✨ New Features & Improvements

- **Arranger role**: artists can be credited as Arranger (RED and OPS), and Discogs "Arranged By" credits map to it. DIC has no confirmed Arranger role, so arranger credits are left out of DIC uploads, with a warning naming them.
- **Artist tags in the tracklist** (opt-in): `artist_tags_in_tracklist = true` under `[upload.description]` wraps each artist name in the group description's tracklist in `[artist][/artist]`. Thanks @jerkiz for the request
- **File name normalization in torrents** (opt-in): `torrent_name_normalization = "NFC"` (or `"NFD"`) under `[upload]` normalizes the file names written into generated .torrent files. For tagging on macOS and seeding from Linux, where the client could not find the files. Thanks @zenermerps for the request
- When a cover upload fails, answering `r` at the "Continue without a cover image?" prompt now asks which image host to retry with, as the spectral retry prompt does, instead of retrying the host that just failed. Thanks @NoelleTGS for the request
- Multi-disc CD logs are checked properly (ported from @chodeus's fork, thanks @chodeus):
  - a log covering several discs is checked against the whole release, even when kept in `CD1/`, instead of failing a good rip on disc 2's CRCs;
  - a log with track-ripped and range-ripped discs no longer fails;
  - a range replaced by an appended track rerip is checked per file;
  - every track needs a file of its own, so two tracks sharing a CRC are both checked;
  - the checksum of every appended log is checked, not only the first;
  - `salmon check log <folder>` checks each log against the folder given, as the upload does.

## 🐛 Bug Fixes

- **Adding spectrals to a torrent's description no longer changes the torrent.** The edit (after an upload, and `salmon checkspecs`) sent only some of the edit form's fields, so it cleared the rest: on DIC the edition became "Unknown release", and on every tracker flags such as Scene, Unknown Release, Showcase or Missing Lineage were unset. On RED, each edit also turned every `&` in the description into `&amp;`. salmon now reads the tracker's own edit form and sends it back with only the description changed; if it cannot find that form, it changes nothing and says so. Thanks @Hades233 for the report and for testing on DIC
- `prompt_puddletag = true` no longer crashes with `'NoneType' object is not callable` right after the tag check. Thanks @cy1der for the report
- A catbox upload answered with an empty body is now a failed upload, instead of "done!" with an empty cover URL. Thanks @chodeus
- A network error or timeout while fetching metadata from a store is reported as a scrape error instead of an unhandled exception. Thanks @chodeus

## 🔒 Tracker & Security Improvements

- **An upload or report is never sent twice** when the tracker answers it with a 307 or 308 redirect: salmon stops, and looks the upload up by its infohash.
- More answers are treated as "the tracker may have acted on it", so an upload is looked up by its infohash instead of reported as failed: any 5xx (including Cloudflare's 520 to 524), and any error after the tracker redirected the upload (401, 403, 404, 429, login page, another site, too many redirects). A report in the same situation is not filed again. Thanks @chodeus
- A tracker answer that trickles in no longer keeps a request open forever: the whole answer must arrive within the request timeout. Thanks @chodeus
- A request body the tracker stops reading now fails after the request timeout, instead of hanging salmon and every later upload to that tracker.
- Large uploads on a slow connection (for example a big cover sent to RED's image host) no longer fail while still being sent. On Windows, only the previous point applies.

## What's Changed
* Skip seedboxes set to enabled = false by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/490
* Two error-handling fixes ported from chodeus's fork by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/491
* Three tracker-safety fixes ported from chodeus's fork by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/492
* Send request bodies safely: bound a stall, let slow uploads finish, never replay one by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/493
* Keep a torrent's edition when adding spectrals to its description by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/494
* Fix the crash when prompt_puddletag is on by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/495
* Optionally tag artist names in the tracklist by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/496
* Optionally normalize file names in generated torrents by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/497
* Support the Arranger artist role by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/498
* Let a failed cover upload be retried on another host by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/499
* Verify multi-disc track rips instead of skipping them by @redusys in https://github.com/smokin-salmon/smoked-salmon/pull/500

**Full Changelog**: https://github.com/smokin-salmon/smoked-salmon/compare/0.12.0...0.13.0

