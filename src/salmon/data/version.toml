[[changelog]]
version = "0.11.0"
date = "2026-09-24"
notes = """

## ⚠️ Breaking Changes

- **`salmon web` removed**: the spectrals web server now starts on its own during `up`, only while you review spectrals. If you kept a Docker container running with `command: web`, stop it and run each command on demand (`docker compose run --rm salmon up ...`), as the README shows. This also fixes `/spectrals` answering 404 (#426).
- **Tidal needs new credentials**: Tidal metadata now uses Tidal's v2 API. Set `client_id` and `client_secret` under `[metadata.tidal]`; the old `token` is no longer used.
- **ptpimg removed**: ptpimg.me has shut down. The default image host is now catbox, and a config still set to `ptpimg` stops at startup with a message asking you to choose another host.
- **`--yes-all` no longer uploads a new group without a cover**: when no cover is found or its upload fails, salmon asks whether to retry, continue without a cover, or skip that tracker. With `--yes-all` it skips that tracker.

## ✨ New Features & Improvements

- Add RED's own image host (`red`) for covers, with per-tracker cover hosts: `[image.red]`, `[image.ops]` and `[image.dic]` can each set their own `cover_uploader`
- Add the **Ra** (thesungod.xyz) image host (`ra`, needs `ra_key`), for covers and description images; Ra's owner asks that it not be used for spectrals
- Add `--skip-flac-upload` to upload only transcodes into an existing group (`-g`) that already holds the FLAC; the transcode descriptions link to that FLAC
- Add optional AI metadata review (`[upload.ai_review]`)
- Add optional Beatport API scraping (`[metadata.beatport]` username and password)
- Add the `default_spectral_ids` config option
- `checkconf --seedbox` now logs in to the torrent client and lists the rclone remote, instead of only reading the config
- Support classical composer and conductor tags
- Map Qobuz `epmini` releases to EP
- Check each log's CRCs against its own disc folder, so multi-disc releases are no longer decoded once per log

## 🐛 Bug Fixes

- Fix retagging writing tags to the wrong files when files are named `1-01`, `1-02`, ...
- Fix Discogs multi-disc tracklists (`1-01`, `2-01` positions) collapsing into one disc
- Fix tracks being lost when combining metadata
- Fix Apple Music token extraction
- Fix CRC verification of logs with an appended EAC re-rip
- Fail the FLAC integrity check when the STREAMINFO MD5 is unset
- Clear a partial hardlink tree before falling back to a plain copy
- Keep remixer extraction inside one parenthesised group
- Fix Bandcamp parsing for catno-prefixed and label-hosted releases
- Fix Qobuz Open URLs in metadata source matching, and stop Qobuz search from running when Qobuz is not configured
- Fix a Beatport scraper type error and artist names being split
- Fix a serialization error when the Discogs token is missing
- Fix a request checker crash when `logCue` is missing on OPS
- Fix rclone progress output during seedbox uploads
- Session cookies pasted in decoded form (as some cookie editors show them) now work
- Show the image host's error message when an imgbb, ptscreens or Ra upload fails
- Update the source icons used in descriptions (the ptpimg links were dead)

## 🔒 Tracker & Security Improvements

- The site log check no longer floods `login.php` when the session cookie is missing or expired: redirects are followed through the rate limiter, and a redirect to the login page stops with a clear message
- An upload or report whose outcome is unknown (a timeout or dropped connection after it was sent) is never sent again: salmon looks the torrent up instead of risking a duplicate
- Reuse one kept-alive connection pool per tracker instead of opening a connection per request
- Update anyio, aiohttp, Pillow, soupsieve and idna to versions that fix known security vulnerabilities (the Docker images include them)
- The test suite and formatting checks now run in CI

