[[changelog]]
version = "0.10.1"
date = "2026-03-11"
notes = """
## ⚠️ Breaking Changes

- **SQLite database removed**: The SQLite database has been replaced with in-memory state. This simplifies deployment and removes the need for database file management. The `salmon migrate` command is no longer needed during installation.
- **Project migrated to src layout**: The project has been restructured to a standard Python src layout (`src/salmon/`). The build backend has been switched to **uv**. If you are running from source, you may need to reinstall the package.
- **Junodownload metadata source dropped**: Junodownload has been removed as a metadata source. 

## ✨ New Features & Improvements

- Add **Apple Music** multi-storefront search support (replacing the old iTunes scraper)
- Add `--essential-only` option to strip extra files during upload and conversion
- Add `display_host` config option for web interface — server now binds to `0.0.0.0` by default for Docker/remote access, while user-facing URLs use `display_host` (defaults to `localhost`)
- Add classical genre detection warning during metadata review
- Add OPS split release type support
- Extract **Bandcamp** catalog numbers from release pages
- Simplify **Tidal** region handling and pass country code through API pipeline

## 🐛 Bug Fixes

- Fix an issue where RED may incorrectly create a new group instead of uploading to an existing group when using cookie-only uploads
- Fix aiohttp aiodns issue on Windows by excluding speedups extra
- Fix spectral filenames with undecodable characters causing database errors
- Fix tracker auth error when debug messages are enabled
- Fix preferred metadata title override not being applied
- Fix spurious remixer artists and Discogs URL matching
- Fix scraper dispatch and search issues across multiple metadata sources
- Fix zero-length folder segments causing path errors
- Fix torrent generation before authentication
- Handle multi-tracker upload failure gracefully instead of crashing

## 🔒 Tracker & Security Improvements

- Default to using API key instead of cookie for tracker requests when an API key is configured
- Refactor Dockerfile to use multi-stage build for smaller images
- Replace `FormData` with `UploadFiles` struct for cleaner upload file handling
- Improve tracker HTTP error handling and redact sensitive data from debug output
- Improve `checkconf` diagnostics for tracker connection testing

