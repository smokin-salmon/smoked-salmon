# Smoked Salmon Configuration File
# Every setting is listed, with its default and an explanation, in config.reference.toml: installed next to
# this file (`salmon checkconf --reset` prints where), and at
# https://github.com/smokin-salmon/smoked-salmon/blob/master/src/salmon/data/config.reference.toml
# Wiki: https://github.com/smokin-salmon/smoked-salmon/wiki/Configuration

[directory]
download_directory = '.music'
dottorrents_dir = '.torrents'
# library_dirs = ['/data/media/music']

# Uncomment the header and the keys of each tracker you use. salmon does not start without one.
[tracker]
# [tracker.red]
# session = ''
# api_key = ''

# [tracker.ops]
# session = ''
# api_key = ''

# [tracker.dic]
# session = ''

# Settings often changed. The rest, including [[seedbox]] and [web], are in config.reference.toml.
[upload]
# conversions = ["24bit", "16bit", "320", "V0"]

[image]
# cover_uploader = "catbox"
# specs_uploader = "catbox"
