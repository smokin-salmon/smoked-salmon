album = "Simon & Garfunkel and Dave Grusin, The Graduate (soundtrack)"
why = "A soundtrack shared by a duo with '&' in its name and the film's composer: every store credits 'Simon & Garfunkel' as one artist on its own tracks, and Dave Grusin on his. A name with '&' that must not be split, beside another act's tracks."
edition = "Columbia/Legacy 2019 digital, 14 tracks (Deezer 96900992 = MusicBrainz a0f4c5d7 by barcode 886447698648; Deezer's upc lookup also resolves the CD's 074640318023); Discogs 449586 is the 1990 CD (barcodes 886977066429 and 07464031802), the same 14 tracks in the same order."
known_wrong = []
files_from = "deezer"

[sources]
deezer = "the public API's album, with `tracklist` the album page's SONGS (as salmon's fetch_data joins them), trimmed to what the parser reads"
musicbrainz = "ws/2 release XML with salmon's includes, in tests/fixtures/stores/musicbrainz/release/, trimmed to what the parser reads"
discogs = "the public API's release (no token), trimmed to what the parser reads"
qobuz = "the API's album in the API's shape: what the parser reads, plus the credits Qobuz sends (the album's artists[], each track's performer and performers line, composer on a classical release) and genres_list as sent"
tags = "constructed from the store data named in the comment above [[track]], never from anyone's files"

[right]
performers = ["Simon & Garfunkel", "Dave Grusin"]
how_we_know = "Deezer, MusicBrainz and Discogs agree track by track: Simon & Garfunkel on tracks 1, 3, 5, 7, 9, 11, 13 and 14, Dave Grusin (credited 'David Grusin' on MusicBrainz) on 2, 4, 6, 8, 10 and 12, each the only artist on its tracks"
open = "The release's artist: Deezer's album artist is Simon & Garfunkel (with both as album contributors), MusicBrainz credits 'Paul Simon; Simon & Garfunkel; David Grusin', Discogs Various; ALBUMARTIST is left open, as for Pulp Fiction. Per track, not judged by the test yet: Simon & Garfunkel main on their eight tracks and Dave Grusin on his six, neither on the other's"

