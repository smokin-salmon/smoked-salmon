album = "Bernstein, West Side Story: Te Kanawa, Carreras, Troyanos, Bernstein conducting (DG 1985)"
why = "The composer conducts his own work: Deezer states Leonard Bernstein main_artist, composer and conductor on all 33 tracks. The singers are main where they sing, the Leonard Bernstein Orchestra on the 27 West Side Story tracks and the Israel Philharmonic Orchestra on the 6 tracks of the On the Waterfront suite."
edition = "DG 415 253-2, 2 CDs, 1985, 33 tracks: Deezer 6450736 (digital, UPC 028941525321). MusicBrainz 9b5eabf5 is the German CD with that barcode, the same 33 tracks; MusicBrainz also has the US CD e476c50a with the same barcode, track list and lengths, and 9b5eabf5 is the one dated (1985-03-19). Discogs 1968417 is the release MusicBrainz links. Qobuz 0002894152532 is the same UPC less its check digit, the same 33 tracks on 2 discs."
known_wrong = ["Deezer parse: Leonard Bernstein a main artist beside his conductor and composer credits (and in ARTIST on every track of the files tagged from it)", "MusicBrainz parse: Bernstein main, not conductor, and no composer on any track; the Leonard Bernstein Orchestra on no track; the Israel Philharmonic Orchestra under its MusicBrainz name in Hebrew script, on the 6 On the Waterfront tracks and on 'America' (1.12), whose recording MusicBrainz credits to the Israel Philharmonic Orchestra & Chorus", "Discogs parse: 0 tracks: the tracklist is two index tracks (West Side Story, 27 sub-tracks; On the Waterfront, 6) and the parser drops sub-tracks", "Qobuz parse: COMPOSER Stephen Sondheim, the lyricist, on the 27 West Side Story tracks, from Qobuz's composer field, where its performers line names Bernstein Composer and Sondheim Lyricist; Bernstein main beside conductor; the singers and both orchestras, each a MainArtist on its tracks, guessed guests, as the album's artists[] lists only Bernstein", "merge: on the 27 West Side Story tracks Qobuz's Sondheim, the lyricist, is a composer beside Bernstein (from Qobuz's composer field)", "merge: the Israel Philharmonic Orchestra twice on the 6 On the Waterfront tracks, Deezer's and Qobuz's spelling beside MusicBrainz's Hebrew name, and MusicBrainz's alone on 'America' (1.12) beside the Leonard Bernstein Orchestra", "merge: one singer in two spellings on 'I Feel Pretty' (2.1), 'Luise Edeiken' (the files' ARTIST, from Deezer's ARTISTS) beside 'Louise Edeiken' (Deezer's contributors, MusicBrainz and Qobuz)"]
files_from = "deezer"

[sources]
deezer = "the public API's album, with `tracklist` the album page's SONGS (as salmon's fetch_data joins them), trimmed to what the parser reads"
musicbrainz = "ws/2 release XML with salmon's includes, in tests/fixtures/stores/musicbrainz/release/, trimmed to what the parser reads"
discogs = "the public API's release (no token), trimmed to what the parser reads"
qobuz = "the API's album in the API's shape: what the parser reads, plus the credits Qobuz sends (the album's artists[], each track's performer and performers line, composer on a classical release) and genres_list as sent"
tags = "constructed from the store data named in the comment above [[track]], never from anyone's files"

[right]
not_main = ["Leonard Bernstein"]
how_we_know = "Deezer, Qobuz and Discogs state Bernstein composer and conductor (Qobuz's performers line: Composer, Conductor, MainArtist; Discogs: Composed By, Conductor); RED's guidance on classical credits the composer as composer and the conductor as conductor, not main. Deezer's contributors and Qobuz's performers lines agree on the singers and the orchestra as main artists on the tracks they perform: the Leonard Bernstein Orchestra on the 27 West Side Story tracks, the Israel Philharmonic Orchestra on the 6 On the Waterfront tracks."
open = "Whether the singers are credited on every track or per track: Deezer and Qobuz name each singer only on the tracks they sing, MusicBrainz credits the release to Bernstein, Te Kanawa, Carreras, Troyanos, Ollmann and Horne and every track to Bernstein alone (its composer), and Discogs credits the release to the same six. Which singers lead the release (the principals, or every singer on a track)."

