album = "Nirvana, Nevermind (Super Deluxe Edition)"
why = "A deluxe edition full of versions (demos, rough mixes, live, BBC sessions): no remixer may be read from a version."
edition = "Qobuz has no Super Deluxe Edition under this UPC: 0060253749865 is the 13-track standard Nevermind, another edition. Discogs 8199204 is the 2011 2-CD Deluxe Edition, 41 tracks. Their tracks merge with their matches among the 70."
known_wrong = ["merge: 'Devonshire' read as a remixer from the 'Devonshire Mixes' versions"]
files_from = "deezer"

[sources]
deezer = "the public API's album, with `tracklist` the album page's SONGS (as salmon's fetch_data joins them), trimmed to what the parser reads"
musicbrainz = "ws/2 release XML with salmon's includes, trimmed to what the parser reads"
discogs = "the public API's release (no token), trimmed to what the parser reads"
qobuz = "the API's album, credit fields only, in the API's shape, trimmed to what the parser reads"
tags = "constructed from the store data named in the comment above [[track]], never from anyone's files"

[right]
release_main = ["Nirvana"]
remixers = []
how_we_know = "Deezer, MusicBrainz and Discogs agree on Nirvana, as does Qobuz's standard edition; the versions name no remixer"

