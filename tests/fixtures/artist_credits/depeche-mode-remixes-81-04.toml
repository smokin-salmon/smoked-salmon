musicbrainz = "ws/2 release XML with salmon's includes, in tests/fixtures/stores/musicbrainz/release/, trimmed to what the parser reads"
discogs = "the public API's release (no token), trimmed to what the parser reads"
qobuz = "the API's album in the API's shape: what the parser reads, plus the credits Qobuz sends (the album's artists[], each track's performer and performers line, composer on a classical release) and genres_list as sent"
tags = "constructed from the store data named in the comment above [[track]], never from anyone's files"

[right]
release_main = ["Depeche Mode"]
not_main = ["Air", "Daniel Miller", "Rico Conning", "Jack Dangers", "Renegade Soundwave", "Underworld", "The Beatmasters", "DJ Muggs", "Chamber", "Thomas Brinkmann", "Jon Marsh", "Alan Moulder", "DJ Shadow", "Kruder & Dorfmeister", "Speedy J", "Dave Clarke", "Timo Maas", "Danny Tenaglia", "Club 69", "Rex The Dog", "Ulrich Schnauss", "Headcleanr", "LFO", "Colder", "Goldfrapp"]
how_we_know = "The slipcase back lists each track's mix and who remixed it (the limited 3-CD, scans on Discogs release 339234): 'Pain Killer', mix 'Kill The Pain DJ Shadow vs Depeche Mode', remix by DJ Shadow, so 'DJ Shadow vs Depeche Mode' is the mix's name and DJ Shadow its remixer, never a main. The same column names a remixer on every track: Chamber on 'I Feel Loved (Chamber's Remix)' (a duo, Paul Freegard and Doug Hart, on MusicBrainz and Discogs; Deezer's Thomas Brinkmann is another artist), 'DM' (Depeche Mode) on five of their own tracks, and, among others, Flood, William Orbit, Adrian Sherwood and Mike Shinoda on tracks whose titles name no remixer. Deezer, MusicBrainz, Discogs and Qobuz all give Depeche Mode alone as the release's artist (Qobuz's artists[] lists only Depeche Mode, main-artist). The column's capitals don't settle spellings (AIR, FRANCOIS KEVORKIAN), and it names Mike Shinoda and Colder only as remixers: whether they are also guests is not judged"

