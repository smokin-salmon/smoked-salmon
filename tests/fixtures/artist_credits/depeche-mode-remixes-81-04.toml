album = "Depeche Mode, Remixes 81>04"
why = "A band's remix compilation over three discs: a remixer on most tracks, the band the only main; Deezer states the remixers on 13 tracks and leaves the rest to the titles, and states one remixer, DJ Shadow, as a main beside the band."
edition = "The 3-disc, 37-track edition, 2004 (Deezer 6709180 = MusicBrainz c66b921d by barcode, digital, MusicBrainz's with a leading 0; the only MusicBrainz release with that barcode). Discogs 339234 is the limited 3-CD edition (XLCDMUTEL8, barcode 724387455924): MusicBrainz links no Discogs release, its release group links master 26034, whose main release is a 12-inch box set in another order, and 339234 has the same 37 tracks in Deezer's order. Qobuz 0724387455955 has the same UPC with a leading 0 and the same 37 tracks on 3 discs."
known_wrong = ["Deezer parse: DJ Shadow main on 'Painkiller (Kill The Pain Mix)' as well as its remixer, as Deezer's contributors list him as main_artist beside the band; the merge credits him only as remixer", "Deezer parse: Thomas Brinkmann the remixer of 'I Feel Loved (Chamber's Remix)', which the sleeve credits to Chamber (Paul Freegard and Doug Hart)", "MusicBrainz parse: DJ Shadow main on 'Painkiller (Kill the Pain mix)', from the recording's credit 'DJ Shadow vs. Depeche Mode', where this release's track credits Depeche Mode alone", "merge: Thomas Brinkmann a remixer of 'I Feel Loved (Chamber's Remix)' beside Chamber, from the Deezer parse", "merge: two remixers named from the titles' remix names, 'Air \"Around the Golf\"' on 'Home' and 'Chamber's' on 'I Feel Loved (Chamber's Remix)', the first beside Air itself, which Deezer states, and MusicBrainz also gives (Discogs as AIR)", "output: REMIXER on 'Home' holds one remixer in two spellings, 'Stéphane Briat; Stéphane \"Alf\" Briat'; likewise 'François K; François Kevorkian' on 'Policy of Truth' and 'Personal Jesus', MusicBrainz's and Discogs's forms of one name", "output: REMIXER on 'I Feel Loved (Chamber's Remix)' holds Thomas Brinkmann beside Chamber, from the merge"]
files_from = "deezer"
output = true

