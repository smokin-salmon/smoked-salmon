album = "Elton John, The Lockdown Sessions"
why = "One artist's album of duets, some of them other artists' songs with him as a guest: tracks 6 (Gorillaz), 8 (Miley Cyrus) and 12 (Lil Nas X) are led by others with Elton John featured, the bonus-track shape. On track 3 the stores disagree: MusicBrainz and Discogs give Surfaces with Elton John featured, Deezer and Qobuz both as main. Track 12 has no Qobuz performers line."
edition = "EMI 2021, 16 tracks, UPC 602438711611: Deezer 265764282 = MusicBrainz 3a823c2c = Discogs 21373180; Qobuz is UPC 0602438711857, the same 16 tracks in the same order."
known_wrong = ["qobuz: each duet partner (Dua Lipa, Charlie Puth, Brandi Carlile and nine more) is a guessed guest: Qobuz names both MainArtist, and the album's artists[] lists only Elton John", "qobuz: on 3, where Qobuz names Surfaces and Elton John both MainArtist, Elton John is main and Surfaces a guess; Deezer has both main, MusicBrainz and Discogs Surfaces with Elton John featured", "qobuz: 12 has no performers line, so Elton John is main and its performer, Lil Nas X, a guessed guest", "qobuz: 7's 'Olly Alexander (Years & Years)' is read as one guest's name, where the other stores credit Years & Years as main", "musicbrainz: 8's 'Miley Cyrus feat. WATT, Elton John, Yo-Yo Ma, Robert Trujillo & Chad Smith' is read with every name main, Miley Cyrus as 'MILEY'", "merge: with the files in deemix's default FLAC shape, salmon reads their plain ARTIST values as main and lets the files win over the stores that say guest, so Elton John is main on 6, 8 and 12 and 6LACK, Andrew Watt, Yo-Yo Ma, Robert Trujillo and Chad Smith main on theirs", "merge: 7 credits 'Olly Alexander (Years & Years)' as a guest, and Years & Years nowhere", "output: ALBUMARTIST is 'Various', not Elton John"]
files_from = "deezer"
output = true

