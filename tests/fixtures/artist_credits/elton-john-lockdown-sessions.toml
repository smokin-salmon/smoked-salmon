[right]
how_we_know = "Deezer, MusicBrainz, Discogs and Qobuz agree: Elton John the album's artist; Gorillaz, Miley Cyrus and Lil Nas X lead 6, 8 and 12 with Elton John featured (Qobuz has no line for 12, and gives Lil Nas X as its performer); 6LACK on 6, and Andrew Watt, Yo-Yo Ma, Robert Trujillo and Chad Smith on 8, featured; PNAU the remixer on 1; the other tracks name two or three mains"
open = "Not judged by the test: the release-wide judge reads Elton John's guest credits on 6, 8 and 12 beside his main ones as 'main and guest at once', which here is right, and whether a duet partner is the release's main or guest is RED's call, not the stores'. Per track: 6, 8 and 12 led by their own artists with Elton John a guest; 3 open (Surfaces with Elton John featured, or both main)"

