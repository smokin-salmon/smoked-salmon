album = "Fritz Reiner, Wiener Philharmoniker: Brahms Hungarian Dances, Dvořák Slavonic Dances"
why = "Two composers, one orchestra and conductor (Reiner, Wiener Philharmoniker, Sofiensaal June 1960: Decca SXL 2249 / London CS 6198): COMPOSER per work, ARTIST orchestra then conductor. Discogs' parse loses every track."
edition = "Deezer 579002271: Archipel 2023 remaster of the same 1960 recording, 13 tracks (Brahms and Dvořák only; Decca's own digital, 028948102617, adds Strauss); MusicBrainz 688898bc: Decca Weekend Classics CD 417 696-2 (1988, 028941769626, 13 tracks); Discogs 4899421: the same Decca CD. The original: Discogs master 591895, London CS 6198 (US, Nov 1960), Decca SXL 2249 (UK, 1961)"
known_wrong = ["Discogs parse: 0 tracks: the tracklist is two index tracks (Hungarian Dances, 8 sub-tracks; Slavonic Dances, 5) and the parser drops sub-tracks", "Deezer parse: ARTIST 'Fritz Reiner & Vienna Philharmonic', conductor before orchestra; Reiner main, not conductor", "Deezer and MusicBrainz parse: no COMPOSER role on any track (Brahms, Dvořák absent)"]
