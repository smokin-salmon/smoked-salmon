album = "Fritz Reiner, Wiener Philharmoniker: Brahms Hungarian Dances, Dvořák Slavonic Dances"
why = "Two composers, one orchestra and conductor (Reiner, Wiener Philharmoniker, Sofiensaal June 1960: Decca SXL 2249 / London CS 6198): COMPOSER per work, ARTIST orchestra then conductor. Discogs' parse loses every track."
edition = "Deezer 579002271: Archipel 2023 remaster of the same 1960 recording, 13 tracks (Brahms and Dvořák only; Decca's own digital, 028948102617, adds Strauss); MusicBrainz 688898bc: Decca Weekend Classics CD 417 696-2 (1988, 028941769626, 13 tracks); Discogs 4899421: the same Decca CD. The original: Discogs master 591895, London CS 6198 (US, Nov 1960), Decca SXL 2249 (UK, 1961)"
known_wrong = ["Discogs parse: 0 tracks: the tracklist is two index tracks (Hungarian Dances, 8 sub-tracks; Slavonic Dances, 5) and the parser drops sub-tracks", "Deezer parse: ARTIST 'Fritz Reiner & Vienna Philharmonic', conductor before orchestra; Reiner main beside conductor; on track 13 Reiner composer beside Dvořák", "MusicBrainz parse: Reiner main, not conductor", "MusicBrainz parse: no COMPOSER role on any track (Brahms, Dvořák absent)", "Qobuz parse: track 13's composer Fritz Reiner alone, from Qobuz's composer field, where its performers line also names Antonín Dvořák (the merge has Deezer's Dvořák beside him); the line names Reiner there as composer, not conductor, so track 13 has no conductor", "merge: on track 13, where Qobuz names Reiner composer and not conductor, the classical rule takes his main, so he leaves ARTIST", "Qobuz parse: Reiner main beside conductor; the orchestra, 'Wiener Philharmonic Orchestra' in artists[] and 'Vienna Philharmonic' in the performers line, a guessed guest", "merge: ALBUMARTIST, the ARTISTS tag and the folder's {artists} read the mains only, so they leave out Reiner (conductor)"]
files_from = "deezer"

