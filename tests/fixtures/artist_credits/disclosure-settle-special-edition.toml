album = "Disclosure, Settle (Special Edition)"
why = "A duo's album with a featured singer on most tracks, then remixes of those tracks by others: guest and remixer on one track; one track where the duo are the remixers of someone else."
edition = "Settle (Special Edition), Island 2014, 37 tracks: the album, the deluxe extras and the remixes (Deezer 7480190 = MusicBrainz 8117004b by barcode). Chosen because it is the edition with the remix tracks. Discogs 4617239 is the UK Deluxe Edition: its master lists no 37-track release, and these 17 tracks merge with their matches among the 37. Qobuz 0060253778113 is the same UPC less its check digit, the same 37 tracks."
known_wrong = ["Deezer parse: Sam Smith main on 'Latch'", "merge: with the files in deemix's default FLAC shape, salmon reads their plain ARTIST values as main and lets the files win over the stores that say guest or remixer, so the singers, and Dixon, KAYTRANADA and Hudson Mohawke (remixers), are made main; ALBUMARTIST 'Various' (with other shapes too, from the stores' own mains: see `open`)", "merge: 'Disclosure & Edward Macfarlane (feat. Ed MacFarlane)', one singer in two spellings and two roles", "merge: the TEED remix retitled 'Totally Enormous Extinct Dinosaurs remix'"]
