album = "Emerson String Quartet, Bartók: The String Quartets"
why = "A string quartet as the performer, the composer in the title: the composer must not become the main artist."
edition = "Qobuz 0002894236572 is the same UPC less its check digit, the same 23 tracks."
known_wrong = ["Discogs parse: 0 tracks, no artists (index tracks)", "MusicBrainz parse and the merge: the four players made main beside the quartet"]
files_from = "deezer"

[sources]
deezer = "the public API's album, with `tracklist` the album page's SONGS (as salmon's fetch_data joins them), trimmed to what the parser reads"
musicbrainz = "ws/2 release XML with salmon's includes, trimmed to what the parser reads"
discogs = "the public API's release (no token), trimmed to what the parser reads"
qobuz = "the API's album, credit fields only, in the API's shape, trimmed to what the parser reads"
tags = "constructed from the store data named in the comment above [[track]], never from anyone's files"

[right]
release_main = ["Emerson String Quartet"]
not_main = ["Béla Bartók"]
how_we_know = "Deezer, MusicBrainz and Qobuz agree on the Emerson String Quartet"

