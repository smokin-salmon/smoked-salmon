album = "Mstislav Rostropovich, Berliner Philharmoniker, Herbert von Karajan: Dvořák Cello Concerto, Tchaikovsky Rococo Variations"
why = "A soloist, an orchestra and a conductor over two composers' works (COMPOSER per work): Deezer states each work's composer as a main artist on all 12 tracks, beside his composer credit, and Karajan main beside conductor."
edition = "DG 447 413-2, 1995, 12 tracks: Deezer 6684429 (UPC 028944741322). MusicBrainz 9652cc22 is the digital release with that barcode and links Deezer 6684429 (MusicBrainz also has the 447 413-2 CDs with it, f1b89874 and caa4c6b0). Discogs 3173784 is the 447 413-2 CD that MusicBrainz's f1b89874 links: 9652cc22 links no Discogs release and its release group no master, and master 198728's main release is the 1969 LP. Qobuz 0002894794879 is another issue of the same recording: the same 12 tracks, titles and order, and the same producers and engineers in its performers lines; the Qobuz answer holds no durations to compare."
known_wrong = ["Deezer parse: Herbert von Karajan main beside conductor, and each work's composer main beside his composer credit, Antonín Dvořák on tracks 1-3 and Pyotr Ilyich Tchaikovsky on 4-12 (and all of them in ARTIST on every track of the files tagged from it)", "MusicBrainz parse: the soloist in Cyrillic, 'Мстислав Ростропович', his MusicBrainz artist name, where the release credits him as Mstislav Rostropovich; Karajan main, not conductor; no composer on any track, though MusicBrainz credits each track to its composer", "Discogs parse: 0 tracks: the tracklist is two index tracks (the concerto, 3 sub-tracks; the variations, 9) and the parser drops sub-tracks", "Qobuz parse: Karajan main beside conductor; Tchaikovsky as 'Pyotr Illitch Tchaïkovski', the French form in Qobuz's composer field, where its performers lines have Pyotr Ilyich Tchaikovsky", "merge: the soloist main twice on every track, 'Mstislav Rostropovich' beside MusicBrainz's Cyrillic 'Мстислав Ростропович'; Tchaikovsky composer twice on tracks 4-12, Deezer's 'Pyotr Ilyich Tchaikovsky' beside Qobuz's 'Pyotr Illitch Tchaïkovski'"]
files_from = "deezer"

