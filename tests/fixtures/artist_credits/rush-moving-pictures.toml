album = "Rush, Moving Pictures"
why = "Band control: one band, no guests, every store the same. Anything but 'Rush' everywhere is a regression."
edition = "2011 remaster, 7 tracks (Deezer 942295 = MusicBrainz 715c7e25 by barcode); Discogs 11868041 is the release MusicBrainz links"
known_wrong = []
files_from = "deezer"

[sources]
deezer = "the public API's album, with `tracklist` the album page's SONGS (as salmon's fetch_data joins them), trimmed to what the parser reads"
musicbrainz = "ws/2 release XML with salmon's includes, trimmed to what the parser reads"
discogs = "the public API's release (no token), trimmed to what the parser reads"
qobuz = "the API's album, credit fields only, in the API's shape, trimmed to what the parser reads"
tags = "constructed from the store data named in the comment above [[track]], never from anyone's files"

[right]
release_main = ["Rush"]
how_we_know = "Deezer, MusicBrainz and Discogs agree"

[today.deezer]
