album = "Various Artists, Pulp Fiction (soundtrack)"
why = "A various-artists soundtrack with dialogue tracks: Deezer and MusicBrainz credit the actors; Discogs has 'No Artist' and makes some performers producers."
edition = "Geffen 2019 digital, 20 tracks (Deezer 89920242 = MusicBrainz 729642fc by barcode); Discogs 1347833 is master 17468's main release (1994 MCA CD, 16 tracks)"
known_wrong = ["Discogs parse: 'No Artist (main)' on the dialogue tracks; Urge Overkill, Maria McKee and Ricky Nelson as producers only, so their tracks have no performing artist"]
